# Document manifest: the identity of every document in the corpus.
#
# This replaces the DOC_REGISTRY that used to live inside ingestion/chunk_guidelines.py, and it
# fixes two things beyond moving data out of code.
#
#  1. A Markdown file with no entry used to enter the corpus SILENTLY, tagged `topic =
#     "vih_general"`. Now it is an error: an unidentified document is one whose year and scope
#     the generation prompt cannot see, and the prompt is asked to arbitrate between guidelines
#     spanning 2013 to 2025.
#  2. It is the only place that knows which reference text belongs to which Markdown. The names
#     do not match by any rule (`VIH_TB.md` vs `textos/TB_VIH/`, `ManejoclinicodelasalteracionesNC.md`
#     vs `textos/alteraciones_NC/`), and that pairing is what lets the quality gates use the
#     PDF's own text layer as an oracle for extraction damage.
#
# NOT LISTED, on purpose: `Documento-de-consenso-...-alteraciones-metabolicas-y-riesgo-
# cardiovascular-...pdf`. It is the eighth PDF in data/pdfs/ and has never been part of the
# corpus; its text layer decodes to mojibake ('!"#$%&(((((' plus control characters) because the
# font's ToUnicode CMap is broken. Only PART of it decodes, which is worse than none: a naive
# "is there text?" check passes it. It is the test case for the extractor's triage step.
#
# `markdown` records the file as it is named TODAY. The extractor writes `<doc_id>.md`, so these
# converge when a document is re-extracted.

version = "v1"

# Which specialty answers when nobody picked one (CLI without --specialty, a bare app.invoke).
# Stated as data rather than inferred: with one profile any rule works, and with several a
# silent "first one alphabetically" would decide which guidelines a doctor is answered from.
default_specialty = "vih"

[[document]]
doc_id       = "TAR_2022"
title        = "Documento de consenso de GeSIDA/PNS sobre TAR en adultos con VIH"
specialty    = "vih"
topics       = ["tratamiento antirretroviral"]
organization = "GeSIDA/PNS"
year         = 2022
language     = "es"
markdown     = "TAR_2022.md"
reference    = "TAR_2022/TAR_2022.txt"
source_pdf   = "GuiaGeSIDAPlanNacionalSobreElSidaRespectoAlTratamientoAntirretroviralEnAdultosInfectadosPorElVirusDeLaInmunodeficienciaHumanaActualizacionEnero2022.pdf"

[document.extraction]
# Front matter (cover, panel of authors, contents) ends here; the clinical text
# begins on this page. Read once by a human — it is a fact about this PDF.
first_page   = 10

