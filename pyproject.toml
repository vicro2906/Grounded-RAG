dependencies = [
    "chainlit>=2.11.1",
    "fastembed>=0.8.0",
    "langchain-community<0.4",
    "langgraph>=1.2.5",
    "langgraph-cli[inmem]>=0.4.30",
    "langsmith>=0.8.16",
    "lightrag-hku>=1.4.9.3",
    "networkx>=3.6.1",
    "numpy>=2.4.6",
    "openai>=2.41.1",
    "pandas>=3.0.3",
    "python-dotenv>=1.2.2",
    "qdrant-client>=1.18.0",
    "ragas>=0.4.3",
    "rapidfuzz>=3.14.5",
    "tiktoken>=0.13.0",
